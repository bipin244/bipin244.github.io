<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — Bipin Fultariya</title>
  <meta name="description" content="Coming Soon: Bipin Fultariya's personal site.">
  <meta name="theme-color" content="#08090c">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background: #08090c;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', Arial, sans-serif;
      flex-direction: column;
      overflow: hidden;
    }
    .coming-soon-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .soon-bubble {
      background: #121318;
      border-radius: 24px;
      padding: 48px 40px 40px 40px;
      box-shadow: 0 4px 32px #0005;
      text-align: center;
      position: relative;
      overflow: visible;
    }
    .pulse-circle {
      width: 64px;
      height: 64px;
      margin: 0 auto 28px auto;
      border-radius: 50%;
      background: linear-gradient(135deg,#47feae,#577aed 70%);
      position: relative;
      animation: pulse 1.8s infinite;
      box-shadow: 0 0 0 0 #56cfdb80;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 #56cfdb80; }
      60% { box-shadow: 0 0 0 24px rgba(86, 207, 219, 0); }
      100% { box-shadow: 0 0 0 0 rgba(86, 207, 219, 0);}
    }
    .word-animation {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      gap: 0.16em;
    }
    .word-animation span {
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 1s forwards;
      display: inline-block;
    }
    .word-animation span:nth-child(1) { animation-delay: 0.13s;}
    .word-animation span:nth-child(2) { animation-delay: 0.18s;}
    .word-animation span:nth-child(3) { animation-delay: 0.23s;}
    .word-animation span:nth-child(4) { animation-delay: 0.28s;}
    .word-animation span:nth-child(5) { animation-delay: 0.33s;}
    .word-animation span:nth-child(6) { animation-delay: 0.38s;}
    .word-animation span:nth-child(7) { animation-delay: 0.43s;}
    .word-animation span:nth-child(8) { animation-delay: 0.48s;}
    .word-animation span:nth-child(9) { animation-delay: 0.53s;}
    .word-animation span:nth-child(10) { animation-delay: 0.58s;}
    .word-animation span:nth-child(11) { animation-delay: 0.63s;}
    .word-animation span:nth-child(12) { animation-delay: 0.68s;}
    .word-animation span.space {
      width: 0.7em;
      opacity: 0;
      animation: none;
    }
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .desc {
      color: #b2c5ed;
      font-size: 1.1rem;
      margin-top: 8px;
      margin-bottom: 0;
      letter-spacing: 0.03em;
      opacity: 0.84;
    }
    .site-link {
      display: inline-block;
      margin-top: 22px;
      font-size: 1rem;
      color: #47feae;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      transition: color .18s;
    }
    .site-link:hover {
      color: #7bfedb;
    }
    @media (max-width: 600px) {
      .soon-bubble {
        padding: 36px 10vw 26px 10vw;
        min-width: 0;
      }
      .word-animation {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="coming-soon-container">
    <div class="soon-bubble">
      <div class="pulse-circle">
        <svg width="32" height="32" viewBox="0 0 48 48" aria-hidden="true">
          <linearGradient id="grad1" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#47feae"/>
            <stop offset="100%" stop-color="#577aed"/>
          </linearGradient>
          <circle cx="24" cy="24" r="20" fill="url(#grad1)" />
          <text x="50%" y="60%" text-anchor="middle" alignment-baseline="middle" font-size="16" font-family="Inter,sans-serif" fill="#08090c" font-weight="bold">BF</text>
        </svg>
      </div>
      <div class="word-animation" id="coming-soon-text">
        <span>C</span><span>O</span><span>M</span><span>I</span><span>N</span><span>G</span>
        <span class="space"></span>
        <span>S</span><span>O</span><span>O</span><span>N</span>
        <span>!</span>
      </div>
      <div class="desc">Bipin Fultariya's new website is coming soon.<br>
        Stay tuned for updates.
      </div>
      <a class="site-link" href="mailto:bpnptl24@gmail.com">Contact Me</a>
    </div>
  </div>
  <script>
    // Optionally, add a blinking cursor or repeated animation for "Soon!"
    // Focus on accessibility: add aria-label on the container
    document.querySelector('.coming-soon-container').setAttribute('aria-label', 'Coming soon. The website is under construction.');
  </script>
</body>
</html>
